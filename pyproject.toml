# Tool configuration for Plaidify. The server supports Python 3.11-3.13 (CI
# tests all three; the image runs 3.11); dependencies are in requirements*.txt
# and their hash-locked requirements*.lock files.
# https://docs.astral.sh/ruff/

[tool.ruff]
target-version = "py311"
line-length = 120
# One ruff everywhere: requirements-dev.txt, .pre-commit-config.yaml and CI
# pin this version, so lint and format results never depend on who runs them.
required-version = "==0.14.6"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "B017",  # broad exception assertions are acceptable in crypto-focused tests
    "B904",  # exception chaining is not required for HTTP/error translation paths
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "playwright: mark test as requiring a real Playwright browser (deselected by default)",
    "real_connector: mark test as requiring a live connector backend instead of the mocked connect_to_site fixture",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 73
