# ─────────────────────────────────────────────────────────────────────────────
# Plaidify Sandbox — one-command containerized demo.
#
#   docker compose -f docker-compose.demo.yml up --build
#   open the "Hosted Link UI" URL from the container log — /link needs a
#   session token, which the demo mints for a throwaway sandbox user
#   open http://localhost:8000/docs        # API docs
#
# Everything runs in a single container: the Plaidify API plus three bundled
# demo target sites (GreenGrid utility · Acme Bank · CloudMail). DEMO_MODE makes
# the sandbox connectors discoverable. This is for local evaluation only — never
# expose it as a production deployment; the port listens on 127.0.0.1.
# ─────────────────────────────────────────────────────────────────────────────
services:
  plaidify-demo:
    build:
      context: .
      dockerfile: Dockerfile
      # The `demo` stage adds scripts/demo.py to the production image. Its
      # command starts every demo portal and the API in one process tree, so
      # the connectors' 127.0.0.1 target URLs resolve inside the container.
      target: demo
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_FORMAT: text
    security_opt:
      - seccomp=./deploy/seccomp/chromium.json
      - no-new-privileges:true
    restart: "no"
