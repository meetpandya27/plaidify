# CodeQL configuration for .github/workflows/ci.yml.
#
# Test code is left out of security analysis: its assertions (for example
# `assert "https://partner-a.example.com" in csp`) read as URL "sanitization"
# to the py/incomplete-url-substring-sanitization query, and none of it ships.
name: plaidify-codeql

queries:
  - uses: security-extended

# Log injection is neutralized where records are formatted, not at each call:
# JSONFormatter (the production format) escapes via json.dumps and
# TextFormatter escapes CR and LF (src/logging_config.py, tested in
# tests/test_logging_config.py), so py/log-injection's per-call findings
# describe flows that can't forge a record.
query-filters:
  - exclude:
      id: py/log-injection

paths-ignore:
  - tests
  - sdk/tests
  - sdk-js/tests
  - frontend-next/src/**/*.test.ts
  - frontend-next/src/**/*.test.tsx
  - "**/node_modules"
  - frontend-next/dist
