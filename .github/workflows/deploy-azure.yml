name: Deploy Azure

# Manual deployment of main to Azure Container Apps (docs/AZURE_DEPLOYMENT.md).
#
# - Runs for main only, and only for a commit whose CI run passed.
# - The target GitHub environment holds the Azure credentials. Protect it in the
#   repository settings: required reviewers and a deployment branch policy of
#   `main` (docs/SELF_HOST.md, step 3).
# - One image per commit. Database migrations run, as a Container Apps Job,
#   before any new API or executor revision is created; a failed migration
#   stops the deployment with the old revisions still serving.

on:
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub environment containing Azure deployment secrets and variables
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: deploy-azure-${{ inputs.github_environment }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ref and CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require main and a passing CI run for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Deployments run from main only (this run is for ${REF})."
            exit 1
          fi
          passed="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&per_page=1" --jq '.total_count')"
          if [[ "${passed}" -lt 1 ]]; then
            echo "::error::CI has not passed for ${SHA}. Deploy once the CI run for this commit is green."
            exit 1
          fi
          echo "::notice::CI passed for ${SHA}."

  deploy:
    name: Deploy to Azure Container Apps
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.github_environment }}
    permissions:
      id-token: write
      contents: read
    env:
      # Inputs and variables reach the scripts through the environment only.
      DEPLOY_ENVIRONMENT: ${{ inputs.github_environment }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
      AZURE_APP_ENV: ${{ vars.AZURE_APP_ENV }}
      AZURE_CORS_ORIGINS: ${{ vars.AZURE_CORS_ORIGINS }}
      AZURE_LLM_PROVIDER: ${{ vars.AZURE_LLM_PROVIDER }}
      AZURE_LLM_MODEL: ${{ vars.AZURE_LLM_MODEL }}
      AZURE_SMTP_HOST: ${{ vars.AZURE_SMTP_HOST }}
      AZURE_SMTP_PORT: ${{ vars.AZURE_SMTP_PORT }}
      AZURE_SMTP_USERNAME: ${{ vars.AZURE_SMTP_USERNAME }}
      AZURE_SMTP_FROM: ${{ vars.AZURE_SMTP_FROM }}
      AZURE_PASSWORD_RESET_URL: ${{ vars.AZURE_PASSWORD_RESET_URL }}
      AZURE_BOOTSTRAP_USER_USERNAME: ${{ vars.AZURE_BOOTSTRAP_USER_USERNAME }}
      AZURE_BOOTSTRAP_USER_EMAIL: ${{ vars.AZURE_BOOTSTRAP_USER_EMAIL }}
      AZURE_AUDIT_HMAC_KEY_ROTATING: ${{ vars.AZURE_AUDIT_HMAC_KEY_ROTATING }}
      POSTGRES_ADMIN_LOGIN: ${{ secrets.AZURE_POSTGRES_ADMIN_LOGIN }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      BOOTSTRAP_USER_PASSWORD: ${{ secrets.BOOTSTRAP_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate repository configuration
        shell: bash
        run: |
          set -euo pipefail

          required_values=(
            AZURE_RESOURCE_GROUP
            AZURE_LOCATION
            AZURE_NAME_PREFIX
            AZURE_APP_ENV
            AZURE_CORS_ORIGINS
            POSTGRES_ADMIN_LOGIN
            POSTGRES_ADMIN_PASSWORD
            ENCRYPTION_KEY
            JWT_SECRET_KEY
          )

          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name:-}" ]]; then
              echo "::error::Missing required GitHub environment value: ${value_name}"
              exit 1
            fi
          done

          # The bootstrap administrator needs all three values, and reset mail
          # a server and a From address.
          bootstrap_values="${AZURE_BOOTSTRAP_USER_USERNAME:-}${AZURE_BOOTSTRAP_USER_EMAIL:-}${BOOTSTRAP_USER_PASSWORD:-}"
          if [[ -n "$bootstrap_values" ]] && [[ -z "${AZURE_BOOTSTRAP_USER_USERNAME:-}" || -z "${AZURE_BOOTSTRAP_USER_EMAIL:-}" || -z "${BOOTSTRAP_USER_PASSWORD:-}" ]]; then
            echo "::error::Set all of AZURE_BOOTSTRAP_USER_USERNAME, AZURE_BOOTSTRAP_USER_EMAIL and BOOTSTRAP_USER_PASSWORD, or none."
            exit 1
          fi
          smtp_values="${AZURE_SMTP_HOST:-}${AZURE_SMTP_FROM:-}${AZURE_SMTP_USERNAME:-}${SMTP_PASSWORD:-}"
          if [[ -n "$smtp_values" ]] && [[ -z "${AZURE_SMTP_HOST:-}" || -z "${AZURE_SMTP_FROM:-}" ]]; then
            echo "::error::Password-reset mail needs both AZURE_SMTP_HOST and AZURE_SMTP_FROM (AZURE_SMTP_USERNAME and SMTP_PASSWORD are used only with them)."
            exit 1
          fi

          echo "AZURE_LLM_PROVIDER=${AZURE_LLM_PROVIDER:-openai}" >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check the resource group and the deploying identity
        shell: bash
        run: |
          set -euo pipefail

          # The deploy principal is scoped to this resource group; the group is
          # created once by the subscription owner (docs/SELF_HOST.md, step 2).
          if ! az group show --name "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            echo "::error::Resource group ${AZURE_RESOURCE_GROUP} not found or not accessible. Create it and grant the deploy principal its roles (docs/SELF_HOST.md)."
            exit 1
          fi

          # Object ID of the signed-in service principal, from its own token
          # (no directory read permission needed). Bicep grants it Key Vault
          # Secrets Officer on the vault.
          DEPLOY_PRINCIPAL_OBJECT_ID="$(az account get-access-token --query accessToken -o tsv | python3 -c '
          import base64, json, sys
          payload = sys.stdin.read().strip().split(".")[1]
          payload += "=" * (-len(payload) % 4)
          print(json.loads(base64.urlsafe_b64decode(payload))["oid"])
          ')"
          echo "DEPLOY_PRINCIPAL_OBJECT_ID=${DEPLOY_PRINCIPAL_OBJECT_ID}" >> "$GITHUB_ENV"

      - name: Bootstrap Azure infrastructure
        shell: bash
        run: |
          set -euo pipefail

          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "plaidify-bootstrap-${GITHUB_RUN_ID}" \
            --template-file infra/main.bicep \
            --parameters @infra/main.bicepparam \
            --parameters \
              namePrefix="$AZURE_NAME_PREFIX" \
              environmentName="$DEPLOY_ENVIRONMENT" \
              location="$AZURE_LOCATION" \
              appEnv="$AZURE_APP_ENV" \
              corsOrigins="$AZURE_CORS_ORIGINS" \
              llmProvider="$AZURE_LLM_PROVIDER" \
              llmModel="${AZURE_LLM_MODEL:-}" \
              postgresAdminLogin="$POSTGRES_ADMIN_LOGIN" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              deployPrincipalObjectId="$DEPLOY_PRINCIPAL_OBJECT_ID" \
              deployApplication=false \
              deployMigrationJob=false \
            --output json > bootstrap.json

          output() { jq -r ".properties.outputs.$1.value" bootstrap.json; }
          {
            echo "ACR_NAME=$(output acrName)"
            echo "ACR_LOGIN_SERVER=$(output acrLoginServer)"
            echo "KEY_VAULT_NAME=$(output keyVaultName)"
            echo "POSTGRES_FQDN=$(output postgresFqdn)"
            echo "POSTGRES_DATABASE_NAME=$(output postgresDatabaseName)"
            echo "APP_DATABASE_ROLE=$(output appDatabaseRole)"
            echo "REDIS_NAME=$(output redisName)"
            echo "REDIS_HOST=$(output redisHostName)"
            echo "REDIS_SSL_PORT=$(output redisSslPort)"
            echo "CONTAINER_APP_NAME=$(output containerAppName)"
            echo "ACCESS_EXECUTOR_APP_NAME=$(output accessExecutorAppName)"
            echo "MIGRATION_JOB_NAME=$(output migrationJobName)"
          } >> "$GITHUB_ENV"

      - name: Populate Key Vault runtime secrets
        shell: bash
        run: |
          set -euo pipefail

          put_secret() {
            # A role assignment made moments ago can take a few minutes to
            # reach Key Vault; retry instead of failing the first deployment.
            local name="$1" value="$2" attempt
            for attempt in $(seq 1 30); do
              if az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name "$name" --value "$value" --output none 2>/dev/null; then
                return 0
              fi
              echo "Key Vault write for ${name} not permitted yet (attempt ${attempt}); retrying..."
              sleep 10
            done
            echo "::error::Could not write ${name} to ${KEY_VAULT_NAME}."
            return 1
          }
          get_secret() {
            # Prints the secret's value, or nothing when it does not exist. Any
            # other failure (a role not yet effective, the network) is retried
            # and then fatal: a failed read must never pass for a missing
            # secret, or a kept key would be replaced by a new one.
            local name="$1" value err attempt
            err="$(mktemp)"
            for attempt in $(seq 1 30); do
              if value="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$name" --query value -o tsv 2>"$err")"; then
                rm -f "$err"
                printf '%s' "$value"
                return 0
              fi
              if grep -q "SecretNotFound" "$err"; then
                rm -f "$err"
                return 0
              fi
              echo "Key Vault read of ${name} failed (attempt ${attempt}); retrying..." >&2
              sleep 10
            done
            rm -f "$err"
            echo "::error::Could not read ${name} from ${KEY_VAULT_NAME}." >&2
            return 1
          }
          urlencode() { python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }

          # Generated once, then kept: the application role's password
          # (rotating it on every deployment would break the running revisions
          # until the new ones start), the audit-chain and launch-token keys
          # (which the application would otherwise derive from ENCRYPTION_KEY /
          # JWT_SECRET_KEY) and the /metrics token. Rotate them in Key Vault
          # (docs/RUNBOOK.md).
          for name in database-app-password audit-hmac-key link-launch-secret metrics-token; do
            value="$(get_secret "$name")"
            if [[ -z "$value" ]]; then
              value="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
              put_secret "$name" "$value"
            fi
            echo "::add-mask::${value}"
            if [[ "$name" == database-app-password ]]; then
              APP_DB_PASSWORD="$value"
            fi
          done

          # The retired audit key is passed only while a rotation is under way
          # (docs/RUNBOOK.md, "Audit key").
          if [[ "${AZURE_AUDIT_HMAC_KEY_ROTATING:-}" == "true" ]]; then
            AUDIT_HMAC_KEY_PREVIOUS="$(get_secret audit-hmac-key-previous)"
            if [[ -z "$AUDIT_HMAC_KEY_PREVIOUS" ]]; then
              echo "::error::AZURE_AUDIT_HMAC_KEY_ROTATING is true, but ${KEY_VAULT_NAME} has no audit-hmac-key-previous."
              exit 1
            fi
            echo "ENABLE_AUDIT_HMAC_KEY_PREVIOUS_SECRET=true" >> "$GITHUB_ENV"
          else
            echo "ENABLE_AUDIT_HMAC_KEY_PREVIOUS_SECRET=false" >> "$GITHUB_ENV"
          fi

          REDIS_PRIMARY_KEY="$(az redis list-keys --name "$REDIS_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query primaryKey -o tsv)"
          echo "::add-mask::${REDIS_PRIMARY_KEY}"

          # Migrations connect as the server admin; the API and the executor as
          # the application role the migration job maintains.
          DATABASE_ADMIN_URL="postgresql://$(urlencode "$POSTGRES_ADMIN_LOGIN"):$(urlencode "$POSTGRES_ADMIN_PASSWORD")@${POSTGRES_FQDN}:5432/${POSTGRES_DATABASE_NAME}?sslmode=require"
          DATABASE_URL="postgresql://$(urlencode "$APP_DATABASE_ROLE"):$(urlencode "$APP_DB_PASSWORD")@${POSTGRES_FQDN}:5432/${POSTGRES_DATABASE_NAME}?sslmode=require"
          REDIS_URL="rediss://:$(urlencode "$REDIS_PRIMARY_KEY")@${REDIS_HOST}:${REDIS_SSL_PORT}/0"

          put_secret encryption-key "$ENCRYPTION_KEY"
          put_secret jwt-secret-key "$JWT_SECRET_KEY"
          put_secret database-admin-url "$DATABASE_ADMIN_URL"
          put_secret database-url "$DATABASE_URL"
          put_secret redis-url "$REDIS_URL"

          if [[ -n "${LLM_API_KEY:-}" ]]; then
            put_secret llm-api-key "$LLM_API_KEY"
            echo "ENABLE_LLM_API_KEY_SECRET=true" >> "$GITHUB_ENV"
          else
            echo "ENABLE_LLM_API_KEY_SECRET=false" >> "$GITHUB_ENV"
          fi

          if [[ -n "${HEALTH_CHECK_TOKEN:-}" ]]; then
            put_secret health-check-token "$HEALTH_CHECK_TOKEN"
            echo "ENABLE_HEALTH_CHECK_TOKEN_SECRET=true" >> "$GITHUB_ENV"
          else
            echo "ENABLE_HEALTH_CHECK_TOKEN_SECRET=false" >> "$GITHUB_ENV"
          fi

          if [[ -n "${SMTP_PASSWORD:-}" ]]; then
            put_secret smtp-password "$SMTP_PASSWORD"
            echo "ENABLE_SMTP_PASSWORD_SECRET=true" >> "$GITHUB_ENV"
          else
            echo "ENABLE_SMTP_PASSWORD_SECRET=false" >> "$GITHUB_ENV"
          fi

          if [[ -n "${BOOTSTRAP_USER_PASSWORD:-}" ]]; then
            put_secret bootstrap-user-password "$BOOTSTRAP_USER_PASSWORD"
            echo "ENABLE_BOOTSTRAP_USER_PASSWORD_SECRET=true" >> "$GITHUB_ENV"
          else
            echo "ENABLE_BOOTSTRAP_USER_PASSWORD_SECRET=false" >> "$GITHUB_ENV"
          fi

      - name: Build and push container image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REF="${ACR_LOGIN_SERVER}/plaidify:${GITHUB_SHA}"

          az acr login --name "$ACR_NAME"
          docker build --pull -t "$IMAGE_REF" .
          docker push "$IMAGE_REF"

          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

      - name: Deploy the migration job
        shell: bash
        run: |
          set -euo pipefail

          # Apps untouched (deployApplication=false): the new image reaches
          # the migration job only.
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "plaidify-migrate-${GITHUB_RUN_ID}" \
            --template-file infra/main.bicep \
            --parameters @infra/main.bicepparam \
            --parameters \
              namePrefix="$AZURE_NAME_PREFIX" \
              environmentName="$DEPLOY_ENVIRONMENT" \
              location="$AZURE_LOCATION" \
              appEnv="$AZURE_APP_ENV" \
              corsOrigins="$AZURE_CORS_ORIGINS" \
              llmProvider="$AZURE_LLM_PROVIDER" \
              llmModel="${AZURE_LLM_MODEL:-}" \
              postgresAdminLogin="$POSTGRES_ADMIN_LOGIN" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              deployPrincipalObjectId="$DEPLOY_PRINCIPAL_OBJECT_ID" \
              deployApplication=false \
              deployMigrationJob=true \
              containerImage="$IMAGE_REF" \
            --output none

      - name: Run database migrations
        shell: bash
        run: |
          set -euo pipefail

          MIGRATION_EXECUTION_NAME="$(az containerapp job start --name "$MIGRATION_JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query name -o tsv)"

          if [[ -z "$MIGRATION_EXECUTION_NAME" ]]; then
            echo "::error::Failed to start the migration job"
            exit 1
          fi

          for attempt in $(seq 1 90); do
            MIGRATION_STATUS="$(az containerapp job execution show --name "$MIGRATION_JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --job-execution-name "$MIGRATION_EXECUTION_NAME" --query properties.status -o tsv 2>/dev/null || true)"

            case "$MIGRATION_STATUS" in
              Succeeded)
                echo "::notice::Database migrations completed successfully (${MIGRATION_EXECUTION_NAME})"
                exit 0
                ;;
              Failed|Stopped|Degraded)
                echo "::error::Database migrations ${MIGRATION_STATUS} (${MIGRATION_EXECUTION_NAME}); the running revisions were not changed."
                az containerapp job execution show --name "$MIGRATION_JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --job-execution-name "$MIGRATION_EXECUTION_NAME"
                exit 1
                ;;
              '')
                ;;
              *)
                echo "Migration status: ${MIGRATION_STATUS}"
                ;;
            esac

            sleep 10
          done

          echo "::error::Timed out waiting for database migrations to finish"
          exit 1

      - name: Deploy Plaidify application
        shell: bash
        run: |
          set -euo pipefail

          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "plaidify-application-${GITHUB_RUN_ID}" \
            --template-file infra/main.bicep \
            --parameters @infra/main.bicepparam \
            --parameters \
              namePrefix="$AZURE_NAME_PREFIX" \
              environmentName="$DEPLOY_ENVIRONMENT" \
              location="$AZURE_LOCATION" \
              appEnv="$AZURE_APP_ENV" \
              corsOrigins="$AZURE_CORS_ORIGINS" \
              llmProvider="$AZURE_LLM_PROVIDER" \
              llmModel="${AZURE_LLM_MODEL:-}" \
              postgresAdminLogin="$POSTGRES_ADMIN_LOGIN" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              deployPrincipalObjectId="$DEPLOY_PRINCIPAL_OBJECT_ID" \
              deployApplication=true \
              deployMigrationJob=true \
              containerImage="$IMAGE_REF" \
              enableLlmApiKeySecret="${ENABLE_LLM_API_KEY_SECRET:-false}" \
              enableHealthCheckTokenSecret="${ENABLE_HEALTH_CHECK_TOKEN_SECRET:-false}" \
              enableAuditHmacKeyPreviousSecret="${ENABLE_AUDIT_HMAC_KEY_PREVIOUS_SECRET:-false}" \
              smtpHost="${AZURE_SMTP_HOST:-}" \
              smtpPort="${AZURE_SMTP_PORT:-587}" \
              smtpUsername="${AZURE_SMTP_USERNAME:-}" \
              smtpFrom="${AZURE_SMTP_FROM:-}" \
              passwordResetUrl="${AZURE_PASSWORD_RESET_URL:-}" \
              enableSmtpPasswordSecret="${ENABLE_SMTP_PASSWORD_SECRET:-false}" \
              bootstrapUserUsername="${AZURE_BOOTSTRAP_USER_USERNAME:-}" \
              bootstrapUserEmail="${AZURE_BOOTSTRAP_USER_EMAIL:-}" \
              enableBootstrapUserPasswordSecret="${ENABLE_BOOTSTRAP_USER_PASSWORD_SECRET:-false}" \
            --output none

      - name: Verify the rollout
        shell: bash
        run: |
          set -euo pipefail

          # Both apps must run a ready revision of this commit's image.
          for app in "$CONTAINER_APP_NAME" "$ACCESS_EXECUTOR_APP_NAME"; do
            ready=""
            for attempt in $(seq 1 60); do
              state="$(az containerapp show --name "$app" --resource-group "$AZURE_RESOURCE_GROUP" \
                --query "[properties.latestRevisionName, properties.latestReadyRevisionName, properties.template.containers[0].image]" -o tsv | tr '\n' ' ')"
              read -r latest ready_rev image <<< "$state"
              if [[ "$image" == "$IMAGE_REF" && -n "$latest" && "$latest" == "$ready_rev" ]]; then
                ready="$latest"
                break
              fi
              sleep 10
            done
            if [[ -z "$ready" ]]; then
              echo "::error::${app} has no ready revision running ${IMAGE_REF} (check its probes and logs)."
              exit 1
            fi
            echo "::notice::${app} is serving revision ${ready}"
          done

          # Through the public ingress: exactly 200. A redirect here means the
          # API does not see the ingress' X-Forwarded-Proto (FORWARDED_ALLOW_IPS)
          # and every client would loop, so it fails the deployment.
          APP_FQDN="$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          APP_URL="https://${APP_FQDN}"
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "${APP_URL}/health" || true)"
            case "$code" in
              200)
                echo "::notice::Application URL: ${APP_URL}"
                exit 0
                ;;
              3??)
                echo "::error::${APP_URL}/health answered ${code} (a redirect) instead of 200."
                exit 1
                ;;
            esac
            echo "Health check attempt ${attempt}: HTTP ${code:-no response}"
            sleep 10
          done
          echo "::error::${APP_URL}/health did not answer 200."
          exit 1
