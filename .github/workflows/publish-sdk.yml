name: Publish SDK

# Publishes the Python SDK (sdk/) to PyPI when a tag like sdk-v0.3.0b1 is
# pushed. The tag must match sdk/pyproject.toml's version, the SDK's tests
# must pass, and the upload uses PyPI trusted publishing (OIDC, no token) from
# the `pypi` GitHub environment — configure the trusted publisher on PyPI
# (project plaidify, workflow publish-sdk.yml, environment pypi) and protect
# the environment with required reviewers.

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read

jobs:
  test:
    name: Test SDK (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies (hash-locked)
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run SDK tests
        run: PYTHONPATH=sdk python -m pytest sdk/tests -q

  build:
    name: Build SDK distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("sdk/pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$TAG" != "sdk-v${version}" ]]; then
            echo "::error::Tag ${TAG} does not match sdk/pyproject.toml version ${version} (expected sdk-v${version})."
            exit 1
          fi
      - name: Install build tools
        run: python -m pip install "build==1.6.1" "twine==7.0.0"
      - name: Build SDK package
        working-directory: sdk
        run: python -m build
      - name: Check package
        working-directory: sdk
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdk-dist
          path: sdk/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/plaidify/
    permissions:
      id-token: write # PyPI trusted publishing (OIDC); no API token is stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdk-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
