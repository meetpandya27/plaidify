name: Dependency audit

# Weekly: new advisories are published against pins that haven't changed, so
# the per-commit audit in CI alone would miss them. A failure here means a
# locked dependency now has a known vulnerability; bump it (Dependabot's
# security updates usually already have a PR) and regenerate the locks.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python (hash-locked sets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install "pip-audit==2.10.1"
      - name: pip-audit
        run: pip-audit --strict --require-hashes --disable-pip -r requirements.lock -r requirements-dev.lock -r requirements-kms.lock

  npm:
    name: npm (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [frontend-next, sdk-js]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Shipped dependencies (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Build and test tooling (reported, not failing)
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if ! npm audit --audit-level=high > audit.txt; then
            echo "::warning::npm audit found high or critical advisories in ${PACKAGE}'s development dependencies."
            { echo "### npm audit: ${PACKAGE} (development dependencies)"; echo '```'; tail -n 60 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
