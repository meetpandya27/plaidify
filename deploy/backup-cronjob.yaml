# Scheduled PostgreSQL backups for Plaidify on Kubernetes.
#
# Runs the backup image from deploy/backup/Dockerfile (scripts/backup_db.sh
# with the PostgreSQL 16 client and age): an hourly pg_dump, encrypted to your
# age public key before it is written, verified, and pruned, on a
# PersistentVolume. The compose equivalent is the `backup` service in
# docker-compose.production.yml. Ship the volume's archives off-cluster
# (object storage) for real durability — see docs/DISASTER_RECOVERY.md.
#
# Prerequisites:
#   docker build -f deploy/backup/Dockerfile -t <registry>/plaidify-backup:<tag> .
#   docker push <registry>/plaidify-backup:<tag>     # then set `image:` below
#   kubectl create secret generic plaidify-secrets \
#     --from-literal=database-url='postgresql://user:pass@host:5432/plaidify'
#   kubectl create secret generic plaidify-backup-age \
#     --from-file=recipients=./age-recipients.txt    # public keys only
#
# Apply:
#   kubectl apply -f deploy/backup-cronjob.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plaidify-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plaidify-db-backup
spec:
  schedule: "0 * * * *" # hourly, on the hour (UTC)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70 # postgres user in the alpine image
            fsGroup: 70
          containers:
            - name: backup
              image: ghcr.io/your-org/plaidify-backup:latest # set to the image you pushed
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-c"]
              args:
                - backup_db.sh backup && backup_db.sh verify
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: plaidify-secrets
                      key: database-url
                - name: BACKUP_DIR
                  value: /backups
                - name: BACKUP_RETENTION
                  value: "168" # keep ~7 days of hourly backups
                - name: BACKUP_AGE_RECIPIENTS_FILE
                  value: /etc/plaidify-backup/recipients
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: age-recipients
                  mountPath: /etc/plaidify-backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: plaidify-backups
            - name: age-recipients
              secret:
                secretName: plaidify-backup-age
            - name: tmp
              emptyDir: {}
