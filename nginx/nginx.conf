# TLS-terminating reverse proxy for docker-compose.production.yml.
#
# nginx is the edge: it overwrites X-Forwarded-For with the address it saw
# (a client can't slip in a fake one to dodge rate limits) and sets
# X-Forwarded-Proto, which the API trusts from this network only
# (FORWARDED_ALLOW_IPS in the compose file).

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Docker's embedded DNS, so a recreated API container's new address is
    # picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream plaidify {
        zone plaidify 64k;
        server plaidify:8000 resolve;
        keepalive 16;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        # HSTS belongs to the TLS terminator. The API sends its own copy in
        # production; drop it so browsers see exactly one. Framing, CSP and
        # the other security headers stay the API's (the hosted Link page
        # sets per-session frame-ancestors).
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Matches the API's own 1 MB request-body limit.
        client_max_body_size 1m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Above gunicorn's 120 s worker timeout, so the API answers first.
        proxy_read_timeout 130s;

        # Prometheus scrapes the API on the internal network; never publish it.
        location = /metrics {
            return 404;
        }

        location = /health {
            proxy_pass http://plaidify;
            access_log off;
        }

        location / {
            proxy_pass http://plaidify;
        }
    }
}
