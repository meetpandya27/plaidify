# Alerting rules for Plaidify.
#
# Metric names and labels are the ones the app really exports:
#   prometheus-fastapi-instrumentator 8.x (defaults, status codes grouped):
#     http_requests_total{method,status="2xx|3xx|4xx|5xx",handler}
#     http_request_duration_highr_seconds_bucket{le}      (no labels, 0.01s–60s)
#     http_request_duration_seconds_bucket{method,handler,le="0.1|0.5|1.0|+Inf"}
#   src/metrics.py:
#     plaidify_blueprint_extractions_total{site,status="success|error"}
#     plaidify_browser_pool_active_contexts / plaidify_browser_pool_capacity_contexts
#     plaidify_mfa_challenges_total{mfa_type}
#     plaidify_worker_heartbeat_timestamp_seconds         (access executor)
# The API is job="plaidify", the executor job="access-executor" (prometheus.yml).
# Health probes and scrapes are left out of the traffic ratios so they can't
# dilute them.

groups:
  - name: plaidify-availability
    rules:
      - alert: PlaidifyInstanceDown
        expr: up{job=~"plaidify|access-executor"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} instance is down ({{ $labels.instance }})"
          description: "Prometheus has not been able to scrape {{ $labels.job }} at {{ $labels.instance }} for >2m."

      - alert: PlaidifyTargetMissing
        expr: absent(up{job="plaidify"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Plaidify API scrape target is missing"
          description: "No Plaidify API target is being scraped. Check the service is running and prometheus.yml's service discovery."

      - alert: PlaidifyExecutorMissing
        expr: absent(up{job="access-executor"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Access-job executor scrape target is missing"
          description: >-
            No access-job executor is being scraped, so detached /connect jobs may not be running.
            Check the access-executor service and ACCESS_WORKER_METRICS_PORT.

      - alert: PlaidifyExecutorStalled
        # The executor's event loop updates this every few seconds; a stale
        # value means the worker is alive but stuck (its /health answers 503).
        expr: time() - max by (instance) (plaidify_worker_heartbeat_timestamp_seconds{job="access-executor"}) > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Access-job executor is stalled ({{ $labels.instance }})"
          description: "The executor's event loop has not run for {{ $value | humanizeDuration }}. Jobs are not progressing; restart it and check its logs."

  - name: plaidify-traffic
    rules:
      - alert: PlaidifyHighErrorRate
        # >5% of responses are 5xx over the last 5m.
        expr: |
          sum(rate(http_requests_total{job="plaidify",status="5xx",handler!~"/health|/metrics"}[5m]))
            /
          clamp_min(sum(rate(http_requests_total{job="plaidify",handler!~"/health|/metrics"}[5m])), 0.001)
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate (>5%)"
          description: "More than 5% of HTTP responses have been 5xx for >5m. Current value: {{ $value | humanizePercentage }}."

      - alert: PlaidifySlowRequests
        # More than 5% of requests slower than 1s (i.e. p95 above 1s) for 10m,
        # on the API's fast paths. Browser-driven and streaming endpoints are
        # left out: they are slow by design, bounded by the target sites.
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{job="plaidify",handler!~"/health|/metrics|/connect|/fetch_data|/submit_credentials|/mfa/submit|/blueprints/generate|/link/events/.*"}[5m]))
            -
            sum(rate(http_request_duration_seconds_bucket{job="plaidify",le="1.0",handler!~"/health|/metrics|/connect|/fetch_data|/submit_credentials|/mfa/submit|/blueprints/generate|/link/events/.*"}[5m]))
          )
            /
          clamp_min(sum(rate(http_request_duration_seconds_count{job="plaidify",handler!~"/health|/metrics|/connect|/fetch_data|/submit_credentials|/mfa/submit|/blueprints/generate|/link/events/.*"}[5m])), 0.001)
            > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of API requests take over 1s"
          description: "{{ $value | humanizePercentage }} of requests to the API's fast paths took longer than 1s over the last 10m (p95 above 1s)."

      - alert: PlaidifyHighLatencyP95
        # p95 over every request, browser-driven ones included, above 10s.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_highr_seconds_bucket{job="plaidify"}[5m]))
          ) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Overall p95 latency above 10s"
          description: "95th-percentile latency across all requests has exceeded 10s for >15m (current: {{ $value | humanize }}s). Check target sites, the browser pool, and the LLM provider."

  - name: plaidify-domain
    rules:
      - alert: PlaidifyExtractionFailureRate
        # >20% of blueprint extractions failing over 15m (API and executor).
        expr: |
          sum(rate(plaidify_blueprint_extractions_total{status="error"}[15m]))
            /
          clamp_min(sum(rate(plaidify_blueprint_extractions_total[15m])), 0.001)
            > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Blueprint extraction failure rate >20%"
          description: "More than 20% of extractions have failed for >15m. Check connectors, browser pool, and LLM provider health."

      - alert: PlaidifyBrowserPoolSaturated
        # At least 80% of the configured browser contexts busy for 10m, per
        # process group (BROWSER_POOL_SIZE is reported as the capacity gauge).
        expr: |
          sum by (job, instance) (plaidify_browser_pool_active_contexts)
            /
          sum by (job, instance) (plaidify_browser_pool_capacity_contexts > 0)
            >= 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Browser pool saturated ({{ $labels.job }} {{ $labels.instance }})"
          description: "{{ $value | humanizePercentage }} of browser contexts have stayed busy for >10m; requests may be queuing. Scale the executor or raise BROWSER_POOL_SIZE."
